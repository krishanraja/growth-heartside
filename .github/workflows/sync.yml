# Watches krishanraja/heartside every hour. It reads heartside and the live
# store as they are now and commits nothing: heartside's own repository is
# the only reference for its status and plan, and any job that needs them
# reads heartside's NOW.md live (Ruling, Krish, 2026-10-22). It never
# touches heartside.
#
# If Heartside's rules changed, or the read failed, the run fails, so
# GitHub's failed-run email reaches the repository owner.
name: sync with heartside
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Read heartside and the store, and check its rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 growth.py sync --quiet || {
            echo "Heartside's rules changed, or the sync failed. Run python3 growth.py sync and read its STOP section."
            exit 1
          }
