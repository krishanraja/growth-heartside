# Keeps state/HEARTSIDE-NOW.md current with krishanraja/heartside, so anyone
# opening this repository (Krish, Codex, Cowork) sees what heartside is doing
# without running anything. It reads heartside and the live store, and
# commits state/ only when the heartside commit, the canon, the rules, the
# store or the open pull requests changed. It never touches heartside.
#
# If Heartside's rules changed, the run still commits the STOP notice, then
# fails, so GitHub's failed-run email reaches the repository owner.
name: sync with heartside
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Read heartside and the store
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 growth.py sync --publish --quiet
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Commit the reading if it changed
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "growth-heartside sync"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "sync: heartside $(python3 -c "import json; print(json.load(open('state/heartside.json'))['sha'][:10])")"
            git push
          else
            echo "no change"
          fi
      - name: Fail if Heartside's rules changed
        if: steps.sync.outputs.code != '0'
        run: |
          echo "Heartside's rules changed, or the sync failed. Read state/HEARTSIDE-NOW.md."
          exit 1
