name: Build the Heartside handoff library
# Manual export only. The seven autonomous schedules remain in engine.yml.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: heartside-engine-${{ github.ref }}
  cancel-in-progress: false
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read product truth first
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 growth.py sync --quiet
      - name: Find the current hosted ledger
        uses: actions/github-script@v7
        id: state
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {...context.repo,name:'heartside-state',per_page:100});
            let found = false;
            for (const artifact of artifacts.sort((a,b) => b.created_at.localeCompare(a.created_at))) {
              if (artifact.expired || artifact.workflow_run?.head_branch !== context.ref.replace('refs/heads/','')) continue;
              const {data:run} = await github.rest.actions.getWorkflowRun({...context.repo,run_id:artifact.workflow_run.id});
              if (!['.github/workflows/engine.yml','.github/workflows/handoff.yml'].includes(run.path) || run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}`) continue;
              core.setOutput('run-id',String(run.id)); found = true; break;
            }
            if (!found) {
              for (const workflow_id of ['.github/workflows/engine.yml','.github/workflows/handoff.yml']) {
                const {data} = await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id,branch:context.ref.replace('refs/heads/',''),status:'success',per_page:1});
                if (data.total_count > 0) throw new Error('Hosted state is missing or expired; refusing to replace its publication history with an empty export.');
              }
            }
      - uses: actions/download-artifact@v4
        if: steps.state.outputs.run-id != ''
        with:
          name: heartside-state
          path: local/incoming
          github-token: ${{ github.token }}
          run-id: ${{ steps.state.outputs.run-id }}
      - name: Restore the current hosted ledger
        if: steps.state.outputs.run-id != ''
        run: python3 growth.py snapshot restore local/incoming/state.tgz --replace
      - name: Install the production runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install -r requirements-media.txt
      - name: Build seven checked campaign packs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 growth.py sync --quiet
          python3 growth.py library > local/library-result.json
      - name: Bind the handoff receipt to this archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          result = json.loads(Path('local/library-result.json').read_text())
          assert result['campaigns'] == 7 and result['media_files'] == 105
          release = json.loads(subprocess.check_output(['gh','api','repos/krishanraja/growth-heartside/releases/415745311'],text=True))
          assert release['draft'] and release['tag_name'] == 'growth-engine-2026-10-17'
          receipt = json.loads(Path('docs/VERIFICATION-2026-10-17.json').read_text())
          receipt['workspace_library_sha256'] = receipt.pop('library_sha256', receipt.get('workspace_library_sha256'))
          receipt['release_library_sha256'] = result['sha256']
          receipt['release_library_product_revision'] = result['heartside_sha']
          receipt['library_build_revision'] = os.environ['GITHUB_SHA']
          receipt['library_build_run'] = os.environ['GITHUB_SERVER_URL']+'/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']
          Path('local/handoff/verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Persist every library revision for later publication records
        run: python3 growth.py snapshot export local/checkpoint/state.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: heartside-state
          path: local/checkpoint/state.tgz
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Attach the complete library to the draft handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload growth-engine-2026-10-17 local/handoff/heartside-campaign-library.zip docs/HANDOFF.md docs/CONTROL-CENTRE-BRIEF.md local/handoff/verification.json --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heartside-complete-library
          path: |
            local/handoff/heartside-campaign-library.zip
            local/handoff/verification.json
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
      - name: Bound recovery and library artifact storage
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,{...context.repo,per_page:100});
            for (const [name,keep] of [['heartside-state',3],['heartside-review',3],['heartside-complete-library',1]]) {
              const ours = artifacts.filter(a => a.name===name && a.workflow_run?.head_branch===context.ref.replace('refs/heads/','')).sort((a,b)=>b.created_at.localeCompare(a.created_at));
              for (const artifact of ours.slice(keep)) {
                const {data:run} = await github.rest.actions.getWorkflowRun({...context.repo,run_id:artifact.workflow_run.id});
                if (['.github/workflows/engine.yml','.github/workflows/handoff.yml'].includes(run.path) && run.head_repository?.full_name===`${context.repo.owner}/${context.repo.repo}`)
                  await github.rest.actions.deleteArtifact({...context.repo,artifact_id:artifact.id});
              }
            }
