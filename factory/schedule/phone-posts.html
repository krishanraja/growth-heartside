<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: one phone-width column of post cards grouped by day; the caption copy button is the biggest thing on each card. */
:root{
  --bg:#f3f4f7; --card:#ffffff; --ink:#1b1d26; --muted:#5d6272; --line:#dde0e8;
  --accent:#c2264b; --accent-ink:#ffffff; --done:#2f7a52; --chip:#eceef4;
  --ig:#b4307a; --fb:#2d5fc4; --tt:#14171f;
  --display:"Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12141a; --card:#1c1f28; --ink:#eef0f6; --muted:#a3a8b8; --line:#2e3240;
  --accent:#ff5c82; --accent-ink:#1a0a10; --done:#6fd39c; --chip:#272b37;
  --ig:#f06ab8; --fb:#7aa4ff; --tt:#eef0f6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12141a; --card:#1c1f28; --ink:#eef0f6; --muted:#a3a8b8; --line:#2e3240;
  --accent:#ff5c82; --accent-ink:#1a0a10; --done:#6fd39c; --chip:#272b37;
  --ig:#f06ab8; --fb:#7aa4ff; --tt:#eef0f6; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:16px}
h1{font:700 26px/1.15 var(--display);margin:0;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toggle{font:500 13px var(--body);display:flex;gap:6px;align-items:center;color:var(--muted)}
.day{font:600 13px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.is-done{opacity:.55}
.head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.time{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums}
.plat{font:600 12px/1 var(--body);padding:5px 9px;border-radius:999px;background:var(--chip)}
.plat.instagram{color:var(--ig)} .plat.facebook{color:var(--fb)} .plat.tiktok{color:var(--tt)}
.post{font:600 14px var(--body);color:var(--muted)}
.copy{appearance:none;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 17px var(--body);padding:16px;width:100%;cursor:pointer}
.copy.ok{background:var(--done);color:var(--card)}
.copy:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;text-align:center;text-decoration:none;font:600 14px var(--body);color:var(--ink);background:var(--chip);border-radius:10px;padding:11px 8px}
.cap{white-space:pre-wrap;font-size:14px;color:var(--ink);background:var(--bg);border-radius:10px;padding:10px 12px;margin:0;user-select:all;-webkit-user-select:all;overflow-wrap:anywhere}
.song{font-size:13px;color:var(--muted);margin:0}
.song b{color:var(--ink);font-weight:600}
.done{display:flex;gap:8px;align-items:center;font:500 14px var(--body)}
.done input{width:20px;height:20px;accent-color:var(--done)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);background:var(--card)}
</style>

const KEY='heartside-phone-done';
let done={}; try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PL={instagram:'Instagram',facebook:'Facebook',tiktok:'TikTok'};
function dayName(d){const [y,m,dd]=d.split('-').map(Number);return new Date(Date.UTC(y,m-1,dd)).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric',timeZone:'UTC'})}
function render(){
  const hide=document.getElementById('hideDone').checked;
  const days={};
  POSTS.forEach((p,i)=>{ if(hide&&done[p.id])return; (days[p.date]=days[p.date]||[]).push([p,i]); });
  const keys=Object.keys(days).sort();
  document.getElementById('list').innerHTML = keys.length ? keys.map(d=>`<h2 class="day">${esc(dayName(d))}</h2><div class="list">${days[d].map(([p,i])=>`
   <article class="card ${done[p.id]?'is-done':''}">
     <div class="head"><span class="time">${esc(p.time)}</span><span class="plat ${esc(p.platform)}">${esc(PL[p.platform]||p.platform)}</span><span class="post">${esc(p.post)}</span></div>
     <button class="copy" data-i="${i}">Copy caption</button>
     <div class="links"><a class="btn" href="${esc(p.reel)}" target="_blank" rel="noopener">Open video</a><a class="btn" href="${esc(p.cover)}" target="_blank" rel="noopener">Open cover</a></div>
     <p class="song"><b>${esc(p.track)}</b> · start ${esc(p.start)} · ${esc(p.volume)}${p.sync&&p.sync!=='none'?' · '+esc(p.sync):''}</p>
     <pre class="cap" id="cap-${i}">${esc(p.caption)}</pre>
     <label class="done"><input type="checkbox" id="done-${i}" data-d="${i}" ${done[p.id]?'checked':''}> Posted</label>
   </article>`).join('')}</div>`).join('') : '<div class="empty">Everything here is marked done.</div>';
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('button.copy'); if(!b)return;
  const p=POSTS[+b.dataset.i];
  try{ await navigator.clipboard.writeText(p.caption); b.textContent='Copied. Paste it in the app'; b.classList.add('ok'); setTimeout(()=>{b.textContent='Copy caption';b.classList.remove('ok')},2500); }
  catch(err){ const el=document.getElementById('cap-'+b.dataset.i); const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent='Selected. Tap Copy'; }
});
document.addEventListener('change',e=>{
  if(e.target.id==='hideDone'){render();return}
  const d=e.target.dataset.d; if(d==null)return; const p=POSTS[+d];
  if(e.target.checked)done[p.id]=1; else delete done[p.id]; save(); render();
});
render();
</script>
